<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#112b32">
<title>動作計數器｜楊昀霖 職能治療師</title>
<style>
:root{--ink:#112b32;--mint:#bcf4dc;--muted:#adc7c7;--line:rgba(255,255,255,.15);--panel:#f6f8f3;--accent:#155e56}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--ink);color:#fff;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{cursor:pointer}.app{height:100dvh;min-height:300px;position:relative;isolation:isolate;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse 70% 52% at 50% 28%,#214b50 0%,#14363e 58%,#102930 100%)}.app:before{content:"";position:absolute;pointer-events:none;width:min(95vw,700px);height:min(95vw,700px);top:42%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(119,207,176,.065),transparent 65%);z-index:-1}.top{position:absolute;top:calc(16px + env(safe-area-inset-top));left:clamp(20px,5vw,56px);right:clamp(20px,5vw,56px);display:flex;justify-content:space-between;align-items:flex-start;z-index:10;pointer-events:none}.brand{padding-top:12px;font-size:11px;font-weight:750;letter-spacing:.26em;color:#b9d4d0}.settings-wrap{display:flex;align-items:center;gap:11px;pointer-events:auto}.settings-hint{font-size:12px;color:#b5cbc9;letter-spacing:.04em}.gear{width:54px;height:54px;border-radius:18px;border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.075);color:#f0fbf7;display:grid;place-items:center;position:relative;touch-action:none;transition:background .16s}.gear svg{width:22px;height:22px;position:relative;z-index:2}.gear.active{background:rgba(188,244,220,.20)}.gear .progress-ring{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);transform:rotate(-90deg);overflow:visible}.progress-ring circle{stroke:var(--mint);stroke-width:3;fill:none;stroke-dasharray:145;stroke-dashoffset:145;stroke-linecap:round}.gear.active .progress-ring circle{animation:fillring 2s linear forwards}@keyframes fillring{to{stroke-dashoffset:0}}.count-layer{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:90px 18px 145px;pointer-events:none}.eyebrow{font-size:clamp(13px,2vw,18px);color:#acc8c6;letter-spacing:.15em;font-weight:650}.count{font-size:clamp(126px,35vmin,320px);font-weight:780;letter-spacing:-.085em;line-height:1.16;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:-.085em;text-shadow:0 8px 45px rgba(0,0,0,.08)}.count.five{font-size:clamp(88px,25vmin,240px)}.count.pop{animation:pop .22s cubic-bezier(.2,.9,.3,1)}@keyframes pop{0%{transform:scale(.96);opacity:.8}60%{transform:scale(1.045)}100%{transform:scale(1)}}.target{font-size:clamp(16px,2.4vw,24px);color:#c1d6d0;font-weight:480;letter-spacing:.035em}.footer{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:22px;pointer-events:none;padding:0 clamp(20px,6vw,88px)}.progress-area{width:min(100%,730px)}.progress-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#b8d1cd;margin-bottom:13px;font-weight:550}.progress-row strong{color:#e3faf1;font-size:16px}.track{height:12px;background:rgba(255,255,255,.15);border-radius:100px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#76cdb6,#c0f6df);border-radius:100px;width:0%;transition:width .26s ease}.instruction{color:#9ebcb9;font-size:13px;letter-spacing:.06em;text-align:center}.byline{font-size:11px;letter-spacing:.08em;color:#759b99}.ripple{position:absolute;pointer-events:none;width:110px;height:110px;border:2px solid rgba(188,244,220,.75);border-radius:50%;transform:translate(-50%,-50%) scale(.2);animation:ripple .48s ease-out forwards;z-index:4}@keyframes ripple{to{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}.flash{position:absolute;inset:0;pointer-events:none;background:rgba(183,241,215,.11);animation:flash .28s ease-out forwards;z-index:3}@keyframes flash{to{opacity:0}}.touch-guide{position:absolute;pointer-events:none;border:1.5px solid rgba(190,238,221,.25);border-radius:24px;background:rgba(197,241,223,.03);inset:0;transition:all .2s}.zone{position:absolute;z-index:1;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(194,245,223,.24);border-radius:24px;color:rgba(219,255,243,.7);font-size:clamp(30px,6vmin,56px);font-weight:750;pointer-events:none;transition:background .2s,border .2s,opacity .2s}.zone.active{background:rgba(175,239,213,.15);border-color:rgba(190,250,222,.8);color:#f0fff7;box-shadow:inset 0 0 35px rgba(165,230,207,.06)}.zone.inactive{opacity:.34}.pattern{position:absolute;top:calc(92px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(4,34,36,.40);border:1px solid var(--line);border-radius:100px;padding:10px 16px;font-size:13px;letter-spacing:.08em;color:#d5ece2;white-space:nowrap;pointer-events:none}.pattern b{color:#c6ffdc}.milestone{position:absolute;top:25%;left:50%;transform:translate(-50%,-12px);z-index:8;pointer-events:none;opacity:0;background:#dcffe9;color:#12564a;padding:14px 24px;border-radius:100px;font-weight:750;box-shadow:0 12px 45px rgba(0,0,0,.16)}.milestone.show{animation:toast 1.7s ease both}@keyframes toast{0%{opacity:0;transform:translate(-50%,-4px)}15%,72%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-15px)}}.settings-panel{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(4,23,26,.7);backdrop-filter:blur(10px);padding:14px;touch-action:pan-y}.settings-panel.open{display:flex}.sheet{background:var(--panel);color:#18383b;width:min(100%,520px);max-height:min(92dvh,900px);display:flex;flex-direction:column;border-radius:26px;overflow:hidden;box-shadow:0 25px 85px rgba(0,0,0,.36)}.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:24px 24px 12px}.sheet-head h2{margin:0;font-size:23px;letter-spacing:-.03em}.close{border:0;background:#e7ede8;border-radius:12px;width:40px;height:40px;color:#2d4f50;font-size:24px}.sheet-scroll{overflow-y:auto;overscroll-behavior:contain;padding:2px 24px 26px}.section{padding:20px 0;border-bottom:1px solid #dce6df}.section h3{font-size:15px;margin:0 0 11px;font-weight:750}.section p{font-size:12px;color:#6e8581;margin:8px 0 0;line-height:1.65}.seg{display:flex;gap:7px;flex-wrap:wrap}.seg button{border:1px solid #d5e1da;background:white;color:#43605c;border-radius:12px;padding:12px 13px;min-width:65px;flex:1;font-weight:650;font-size:14px}.seg button.selected{background:#185e55;border-color:#185e55;color:white}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0}.row label{font-size:14px;font-weight:650}.switch{width:49px;height:29px;border-radius:30px;background:#cad5cd;border:0;position:relative;flex-shrink:0;transition:background .2s}.switch:after{content:"";position:absolute;width:23px;height:23px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 2px 5px #0002}.switch.on{background:#207567}.switch.on:after{transform:translateX(20px)}.custom-goal{display:flex;gap:8px;margin-top:9px}.custom-goal input{min-width:0;width:100%;border:1px solid #cddbd1;border-radius:12px;padding:12px;background:#fff;color:#163f3a}.custom-goal button,.utility{border:1px solid #bed7ca;border-radius:12px;padding:12px 15px;background:#e8f4eb;color:#195e50;font-weight:750}.utility-row{display:flex;gap:8px;flex-wrap:wrap}.utility{flex:1}.resource{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;color:#194e48;text-decoration:none;font-weight:650;font-size:14px}.resource span:last-child{font-size:18px;color:#75968e}.done-btn{margin-top:20px;width:100%;border:0;border-radius:15px;background:#153e3d;color:#fff;padding:17px;font-weight:750;font-size:16px}.statusline{font-size:12px;color:#607f78;line-height:1.65;margin-top:12px}.hidden{display:none!important}@media(max-height:550px){.top{top:8px}.gear{width:44px;height:44px;border-radius:13px}.count-layer{padding:30px 18px 74px}.count{font-size:clamp(85px,28vh,170px)}.footer{gap:8px;bottom:10px}.instruction{display:none}.pattern{top:56px}.progress-row{margin-bottom:6px}.track{height:8px}}@media(prefers-reduced-motion:reduce){.count.pop,.milestone.show,.ripple,.flash{animation-duration:.01ms}.fill{transition:none}}
</style>
</head>
<body>
<main class="app" id="app" aria-label="動作計數器。碰觸畫面計數">
  <div id="guide" class="touch-guide hidden"></div>
  <div id="zoneLeft" class="zone hidden">左</div><div id="zoneRight" class="zone hidden">右</div>
  <header class="top"><div class="brand">MOTION <span style="opacity:.56">/</span> COUNTER</div><div class="settings-wrap"><span class="settings-hint" id="gearHint">長按 2 秒設定</span><button class="gear" id="gear" aria-label="長按兩秒開啟設定" title="長按 2 秒開啟設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.8 1.8 0 0 0 .36 1.99l.07.07-1.77 1.77-.07-.07A1.8 1.8 0 0 0 16 18.4a1.8 1.8 0 0 0-1 1.66V21h-2.5v-.94a1.8 1.8 0 0 0-1-1.66 1.8 1.8 0 0 0-1.99.36l-.07.07-1.77-1.77.07-.07A1.8 1.8 0 0 0 8.1 15a1.8 1.8 0 0 0-1.66-1H5.5v-2.5h.94a1.8 1.8 0 0 0 1.66-1 1.8 1.8 0 0 0-.36-1.99l-.07-.07L9.44 6.7l.07.07A1.8 1.8 0 0 0 11.5 7.1a1.8 1.8 0 0 0 1-1.66V4.5H15v.94a1.8 1.8 0 0 0 1 1.66 1.8 1.8 0 0 0 1.99-.36l.07-.07 1.77 1.77-.07.07A1.8 1.8 0 0 0 19.4 10.5a1.8 1.8 0 0 0 1.66 1H22v2.5h-.94A1.8 1.8 0 0 0 19.4 15Z" transform="translate(-1.75 -.75) scale(.95)"/></svg><svg class="progress-ring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="23"/></svg></button></div></header>
  <div class="pattern hidden" id="pattern"></div>
  <div class="count-layer"><div class="eyebrow">已完成</div><div class="count" id="number" aria-live="off">0</div><div class="target">目標 <span id="targetLabel">100</span> 下</div></div>
  <div class="milestone" id="milestone" aria-live="polite"></div>
  <footer class="footer"><div class="progress-area"><div class="progress-row"><span>練習進度</span><span><strong id="percent">0%</strong> <span id="remaining">· 還有 100 下</span></span></div><div class="track"><div id="fill" class="fill"></div></div></div><div class="instruction" id="instruction">輕碰畫面任意位置，開始計數</div><div class="byline">楊昀霖 職能治療師設計</div></footer>
</main>
<div class="settings-panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="sheet"><div class="sheet-head"><h2 id="settingsTitle">練習設定</h2><button class="close" id="close" aria-label="關閉設定">×</button></div><div class="sheet-scroll">
<section class="section"><h3>練習模式</h3><div class="seg" data-choice="mode"><button data-value="free">自由計數</button><button data-value="alternate">左右交替</button><button data-value="pattern">左左右循環</button></div><p>進階模式需碰到亮起的區域才會計數；碰錯不扣分。</p></section>
<section class="section"><h3>有效觸控範圍</h3><div class="seg" data-choice="area"><button data-value="100">100%</button><button data-value="75">75%</button><button data-value="50">50%</button></div><p>自由計數以畫面中央為有效範圍；左右模式則分別縮放左右目標。觸控區會以淡色邊界提示。</p></section>
<section class="section"><h3>目標次數</h3><div class="seg" data-choice="goal"><button data-value="10">10</button><button data-value="20">20</button><button data-value="30">30</button><button data-value="50">50</button><button data-value="100">100</button></div><div class="custom-goal"><input type="number" id="goalInput" min="1" max="9999" inputmode="numeric" placeholder="自訂次數（1～9999）" aria-label="自訂目標次數"><button id="goalApply">套用</button></div></section>
<section class="section"><h3>聲音與回饋</h3><div class="row"><label for="voiceCount">每次觸碰報數</label><button class="switch" id="voiceCount" role="switch" aria-checked="false"></button></div><div class="row"><label for="voiceCheer">里程碑語音鼓勵</label><button class="switch" id="voiceCheer" role="switch" aria-checked="false"></button></div><div class="row"><label for="vibrate">震動回饋</label><button class="switch" id="vibrate" role="switch" aria-checked="false"></button></div><div class="row"><label for="visual">觸碰動畫</label><button class="switch" id="visual" role="switch" aria-checked="false"></button></div><p>語音使用裝置內建中文語音。震動及語音依手機、瀏覽器支援情況而定。</p></section>
<section class="section"><h3>畫面與操作</h3><div class="row"><label for="wake">防止螢幕休眠</label><button class="switch" id="wake" role="switch" aria-checked="false"></button></div><div class="utility-row"><button class="utility" id="fullscreen">切換全螢幕</button><button class="utility" id="reset">重新計數（歸零）</button></div><div class="statusline" id="support">手機瀏覽器可能限制全螢幕或防休眠功能。</div></section>
<section class="section" style="border-bottom:0"><h3>更多復健資源</h3><a class="resource" href="https://relive.tw/stroke/" target="_blank" rel="noopener noreferrer"><span>中風復健懶人包</span><span>↗</span></a><a class="resource" href="https://reliveot.github.io/card/" target="_blank" rel="noopener noreferrer"><span>楊昀霖職能治療師 · 電子名片</span><span>↗</span></a></section>
<button class="done-btn" id="done">完成，回到練習</button></div></div></div>
<script>
(()=>{'use strict';
const defaults={mode:'free',area:100,goal:100,voiceCount:false,voiceCheer:true,vibrate:true,visual:true,wake:true};
let config={...defaults};try{const saved=JSON.parse(localStorage.getItem('motion-counter-settings')||'{}');for(const k of Object.keys(defaults))if(typeof saved[k]===typeof defaults[k])config[k]=saved[k];}catch(e){}
if(!['free','alternate','pattern'].includes(config.mode))config.mode='free';if(![100,75,50].includes(config.area))config.area=100;if(!Number.isInteger(config.goal)||config.goal<1||config.goal>9999)config.goal=100;
const $=id=>document.getElementById(id),app=$('app'),gear=$('gear'),panel=$('panel');let count=0,step=0,wakeLock=null,pressTimer=null,pressId=null,openedFromHold=false,toastTimer=null, lastSpeechAt=0;
const sequence=['left','left','right'];const currentSide=()=>config.mode==='alternate'?(step%2?'right':'left'):sequence[step%3];
function store(){try{localStorage.setItem('motion-counter-settings',JSON.stringify(config));}catch(e){}}
function rangeRect(){const r=app.getBoundingClientRect(),scale=Math.sqrt(config.area/100),w=r.width*scale,h=r.height*scale;return{left:(r.width-w)/2,top:(r.height-h)/2,width:w,height:h};}
function zoneRects(){const r=app.getBoundingClientRect();const insetX=Math.max(12,r.width*.035),insetY=Math.max(86,r.height*.18),gap=Math.max(12,r.width*.04);const availableW=(r.width-2*insetX-gap)/2,availableH=Math.max(90,r.height-2*insetY);const scale=Math.sqrt(config.area/100);const w=availableW*scale,h=availableH*scale;return [{left:insetX+(availableW-w)/2,top:insetY+(availableH-h)/2,width:w,height:h},{left:insetX+availableW+gap+(availableW-w)/2,top:insetY+(availableH-h)/2,width:w,height:h}];}
function inside(p,r){return p.x>=r.left&&p.x<=r.left+r.width&&p.y>=r.top&&p.y<=r.top+r.height;}
function applyRect(el,r){Object.assign(el.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});}
function renderZones(){const free=config.mode==='free';$('guide').classList.toggle('hidden',!free||config.area===100);$('zoneLeft').classList.toggle('hidden',free);$('zoneRight').classList.toggle('hidden',free);$('pattern').classList.toggle('hidden',free);if(free){if(config.area!==100)applyRect($('guide'),rangeRect());$('instruction').textContent=config.area===100?'輕碰畫面任意位置，開始計數':'輕碰框線內，開始計數';}else{const [l,r]=zoneRects();applyRect($('zoneLeft'),l);applyRect($('zoneRight'),r);$('zoneLeft').classList.toggle('active',currentSide()==='left');$('zoneRight').classList.toggle('active',currentSide()==='right');$('zoneLeft').classList.toggle('inactive',currentSide()!=='left');$('zoneRight').classList.toggle('inactive',currentSide()!=='right');$('pattern').innerHTML=config.mode==='alternate'?'順序　<b>左 → 右 → 左 → 右</b>':'順序　<b>左 → 左 → 右</b>（循環）';$('instruction').textContent='請碰觸亮起的'+(currentSide()==='left'?'左':'右')+'側區域';}}
function render(){const n=$('number');n.textContent=count;n.classList.toggle('five',String(count).length>3);n.classList.remove('pop');void n.offsetWidth;if(config.visual)n.classList.add('pop');$('targetLabel').textContent=config.goal;const pct=Math.min(100,Math.round(count/config.goal*100));$('percent').textContent=pct+'%';$('fill').style.width=Math.min(100,count/config.goal*100)+'%';$('remaining').textContent=count>=config.goal?'· 已完成目標':'· 還有 '+(config.goal-count)+' 下';renderZones();}
function vib(ms=14){if(config.vibrate&&navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}
function say(t){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(String(t));utter.lang='zh-TW';utter.rate=.95;utter.pitch=1.04;const voices=speechSynthesis.getVoices();const zh=voices.find(v=>v.lang.toLowerCase()==='zh-tw')||voices.find(v=>v.lang.toLowerCase().startsWith('zh'));if(zh)utter.voice=zh;speechSynthesis.speak(utter);}catch(e){}}
function burst(x,y){if(!config.visual)return;const rip=document.createElement('div');rip.className='ripple';rip.style.left=x+'px';rip.style.top=y+'px';app.appendChild(rip);rip.addEventListener('animationend',()=>rip.remove(),{once:true});const flash=document.createElement('div');flash.className='flash';app.appendChild(flash);flash.addEventListener('animationend',()=>flash.remove(),{once:true});}
function milestone(){const milestones=[25,50,75,100];const previous=(count-1)/config.goal*100,now=count/config.goal*100;const reached=milestones.find(m=>previous<m&&now>=m);if(reached===undefined)return false;const msg=reached===100?'完成目標！做得很好':reached===75?'已經完成四分之三！':reached===50?'完成一半了！':'完成四分之一了！';const el=$('milestone');el.textContent=msg;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800);return msg;}
function tap(e){if(panel.classList.contains('open'))return;const r=app.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};let ok=false;if(config.mode==='free')ok=inside(p,rangeRect());else{const rect=zoneRects()[currentSide()==='left'?0:1];ok=inside(p,rect);}if(!ok)return;count++;step++;burst(p.x,p.y);vib(count===config.goal?35:12);render();const msg=milestone();if(msg&&config.voiceCheer)say(msg);else if(config.voiceCount)say(count);}
// Each pointerdown counts once. The settings button is excluded and never increments.
app.addEventListener('pointerdown',e=>{if(e.target.closest('#gear'))return;if(e.pointerType==='mouse'&&e.button!==0)return;tap(e);},{passive:true});
let touchStart=null;function cancelPress(){clearTimeout(pressTimer);pressTimer=null;pressId=null;gear.classList.remove('active');}
gear.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();e.stopPropagation();cancelPress();pressId=e.pointerId;openedFromHold=false;touchStart={x:e.clientX,y:e.clientY};gear.classList.add('active');try{gear.setPointerCapture(e.pointerId)}catch(_){}pressTimer=setTimeout(()=>{openedFromHold=true;cancelPress();vib(25);openPanel();},2000);});
gear.addEventListener('pointermove',e=>{if(pressId!==e.pointerId||!touchStart)return;if(Math.hypot(e.clientX-touchStart.x,e.clientY-touchStart.y)>25)cancelPress()});['pointerup','pointercancel','lostpointercapture'].forEach(type=>gear.addEventListener(type,()=>cancelPress()));gear.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(!openedFromHold){$('gearHint').textContent='請持續按住 2 秒';setTimeout(()=>{$('gearHint').textContent='長按 2 秒設定'},1600);}openedFromHold=false;});gear.addEventListener('contextmenu',e=>e.preventDefault());
function openPanel(){panel.classList.add('open');syncControls();if('speechSynthesis'in window)try{speechSynthesis.cancel()}catch(e){}}
function closePanel(){panel.classList.remove('open');store();render();requestWake();}
$('close').onclick=closePanel;$('done').onclick=closePanel;panel.addEventListener('pointerdown',e=>{if(e.target===panel)closePanel()});
function syncControls(){document.querySelectorAll('[data-choice]').forEach(group=>{const key=group.dataset.choice;group.querySelectorAll('button').forEach(btn=>btn.classList.toggle('selected',String(config[key])===btn.dataset.value));});['voiceCount','voiceCheer','vibrate','visual','wake'].forEach(k=>{const el=$(k);el.classList.toggle('on',config[k]);el.setAttribute('aria-checked',String(config[k]));});}
document.querySelectorAll('[data-choice]').forEach(group=>group.addEventListener('click',e=>{const btn=e.target.closest('button[data-value]');if(!btn)return;const key=group.dataset.choice;const value=key==='goal'||key==='area'?Number(btn.dataset.value):btn.dataset.value;if(key==='mode'&&value!==config.mode){step=0;}config[key]=value;if(key==='goal')count=0;syncControls();render();store();}));
$('goalApply').onclick=()=>{const n=Number($('goalInput').value);if(!Number.isInteger(n)||n<1||n>9999){$('goalInput').focus();$('goalInput').setCustomValidity('請輸入 1 至 9999 的整數');$('goalInput').reportValidity();return;}$('goalInput').setCustomValidity('');config.goal=n;count=0;syncControls();render();store();$('goalInput').blur();};$('goalInput').addEventListener('input',()=>$('goalInput').setCustomValidity(''));
['voiceCount','voiceCheer','vibrate','visual','wake'].forEach(k=>$(k).onclick=()=>{config[k]=!config[k];syncControls();store();if(k==='wake')requestWake();});
$('reset').onclick=()=>{count=0;step=0;render();$('support').textContent='次數已歸零，設定保持不變。';};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{$('support').textContent='此瀏覽器不支援網頁全螢幕；可試著加入主畫面使用。';return;}$('support').textContent=document.fullscreenElement?'已進入全螢幕。':'已離開全螢幕。';}catch(e){$('support').textContent='瀏覽器未允許全螢幕，可試著加入手機主畫面使用。';}};
async function releaseWake(){if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null;}}
async function requestWake(){if(!config.wake||document.visibilityState!=='visible'){await releaseWake();return}if(!('wakeLock'in navigator)){$('support').textContent='這個瀏覽器不支援防休眠；其他計數功能仍可使用。';return}if(wakeLock)return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null},{once:true});$('support').textContent='已啟用防止螢幕休眠（僅在瀏覽器允許時有效）。';}catch(e){$('support').textContent='防休眠未啟用；部分裝置需 HTTPS、保持頁面可見或關閉省電模式。';}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWake()});window.addEventListener('resize',renderZones);app.addEventListener('contextmenu',e=>e.preventDefault());
// Wake lock can require a user gesture. Retry after first touch without delaying counting.
app.addEventListener('pointerdown',()=>{if(config.wake&&!wakeLock)requestWake()},{once:true,passive:true});
render();syncControls();requestWake();
})();
</script>
</body>
